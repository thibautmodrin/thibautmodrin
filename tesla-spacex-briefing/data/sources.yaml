user_agent: "TeslaSpaceXBriefing/1.0 (+https://github.com/thibautmodrin/thibautmodrin)"
timeout_seconds: 20
retention_days: 30

rss:
  - id: gnews_tesla_en
    company: tesla
    name: Google News Tesla
    url: "https://news.google.com/rss/search?q=Tesla+when:1d&hl=en-US&gl=US&ceid=US:en"

  - id: gnews_spacex_en
    company: spacex
    name: Google News SpaceX
    url: "https://news.google.com/rss/search?q=SpaceX+when:1d&hl=en-US&gl=US&ceid=US:en"

  - id: gnews_tesla_fr
    company: tesla
    name: Google News Tesla FR
    url: "https://news.google.com/rss/search?q=Tesla+when:1d&hl=fr&gl=FR&ceid=FR:fr"

  - id: gnews_voices
    company: both
    name: Google News voix Tesla
    url: "https://news.google.com/rss/search?q=%22Elon+Musk%22+(Tesla+OR+SpaceX)+when:1d&hl=en-US&gl=US&ceid=US:en"

  - id: electrek
    company: tesla
    name: Electrek
    url: "https://electrek.co/feed/"

  - id: teslarati
    company: tesla
    name: Teslarati
    url: "https://www.teslarati.com/feed/"

  - id: spacenews
    company: spacex
    name: SpaceNews
