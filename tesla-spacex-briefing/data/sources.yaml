x:
  enabled: true
  # Requête récente (7 jours max sans Academic). Complétée par les from: de la watchlist.
  extra_query: "(Tesla OR TSLA OR SpaceX OR Starship OR Starlink OR Cybercab OR Optimus OR Roadster)"
